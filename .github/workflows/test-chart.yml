name: Test Chart

on:
  push:
  pull_request:

permissions: {}

jobs:
  lint:
    name: Lint and render the chart
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Helm
        run: make install-helm

      - name: Lint and render the chart
        run: make helm-lint

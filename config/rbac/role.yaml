---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - secrets
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - sshgateway.wutz.dev
  resources:
  - sshgatewayclasses
  - sshroutes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - sshgateway.wutz.dev
  resources:
  - sshgateways
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - sshgateway.wutz.dev
  resources:
  - sshgateways/finalizers
  - sshroutes/finalizers
  verbs:
  - update
- apiGroups:
  - sshgateway.wutz.dev
  resources:
  - sshgateways/status
  - sshroutes/status
  verbs:
  - get
  - patch
  - update

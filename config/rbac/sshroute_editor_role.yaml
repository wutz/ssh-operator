# This rule is not used by the project sshgateway itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the sshgateway.wutz.dev.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: sshgateway
    app.kubernetes.io/managed-by: kustomize
  name: sshroute-editor-role
rules:
- apiGroups:
  - sshgateway.wutz.dev
  resources:
  - sshroutes
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - sshgateway.wutz.dev
  resources:
  - sshroutes/status
  verbs:
  - get

# This rule is not used by the project sshgateway itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over sshgateway.wutz.dev.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: sshgateway
    app.kubernetes.io/managed-by: kustomize
  name: sshgatewayclass-admin-role
rules:
- apiGroups:
  - sshgateway.wutz.dev
  resources:
  - sshgatewayclasses
  verbs:
  - '*'
- apiGroups:
  - sshgateway.wutz.dev
  resources:
  - sshgatewayclasses/status
  verbs:
  - get

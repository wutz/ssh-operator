# This rule is not used by the project sshgateway itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to sshgateway.wutz.dev resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: sshgateway
    app.kubernetes.io/managed-by: kustomize
  name: sshgatewayclass-viewer-role
rules:
- apiGroups:
  - sshgateway.wutz.dev
  resources:
  - sshgatewayclasses
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - sshgateway.wutz.dev
  resources:
  - sshgatewayclasses/status
  verbs:
  - get

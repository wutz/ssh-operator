apiVersion: forgeai.wutz.dev/v1alpha1
kind: SSHGatewayClass
metadata:
  labels:
    app.kubernetes.io/name: ssh-operator
    app.kubernetes.io/managed-by: kustomize
  name: forgeai-ssh
spec:
  # The controller name the ForgeAI operator answers to. A class with another
  # controller name is ignored.
  controllerName: forgeai.wutz.dev/ssh-gateway

apiVersion: sshgateway.wutz.dev/v1alpha1
kind: SSHRoute
metadata:
  labels:
    app.kubernetes.io/name: sshgateway
    app.kubernetes.io/managed-by: kustomize
  name: agent-login
  # The namespace of the backend Service this route reaches.
  namespace: project-demo
spec:
  parentRefs:
    # The gateway of the gateway namespace.
    - name: main
  rules:
    - matches:
        # The login name clients use. A name is claimed by the first route that
        # matches it, so keep it unique across the cluster.
        - username: alice
      # The public keys allowed to log in as alice. Only key authentication is
      # accepted: there is no password.
      authorizedKeys:
        - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIExampleKeyReplaceMeWithYourOwnKeyExample alice@example.com
      backendRefs:
        # The Service that exposes the sshd, in the namespace of the route. The
        # Secret <name>-hostkey holds the sshd host key.
        - name: agent
          # The account the gateway logs in to the backend as.
          username: agent
